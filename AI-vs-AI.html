<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>rock-paper-scissors</title>
        <style>
        body {
            background-color: #00ffc0;
            font-weight: bolder;
            text-align: center;
        }

        .oneline {
            display: inline-block;
            margin-right: 15px;
            font-weight: bolder;
            color: rgb(174, 0, 255);
        }

        .special, .onelines {
            display: inline-block;
            width: 180px;
            margin-right: 15px;
            font-weight: bolder;
            color: rgb(174, 0, 255);
            vertical-align: top;
            text-align: center;
            box-sizing: border-box;
        }

        .updateHU {
            width: 128px;
            height: 64px;
            color: rgb(13, 0, 255);
            font-weight: bolder;
            background-color: #00ffc0;
            border: 5px solid #008080;
        }

        .updateHU:active {
            background-color: #008080;
            border: 5px solid #00ffc0;
        }

        #result {
            color: rgb(119, 112, 255);
            font-weight: bolder;
        }
        </style>
    </head>
    <body>
        <h1>Rock Paper Scissors</h1>
        <h3 id="handAI1" class="oneline">AI 1's move here</h3>
        <h3 id="handAI2" class="oneline">AI 2's move here</h3>
        <h3 id="result">Result here</h3>
        <br>
        <button class="updateHU" onclick="playAI()">play</button>
        <br><br><br><br>
        <h3 class="oneline special">AI 1's wins</h3>
        <h3 class="oneline special">Ties</h3>
        <h3 class="oneline special">AI 2's wins</h3>
        <br>
        <h3 id="wins" class="onelines"></h3>
        <h3 id="ties" class="onelines"></h3>
        <h3 id="losses" class="onelines"></h3>
        <script>
            let handAI1 = "";
            let handAI2 = "";
            let handHU = "";
            let hand = "";
            let result = "";
            let wins = "0";
            let losses = "0";
            let ties = "0";
            let winAI = false;
            let loseAI = false;
            let tieAI = false;
            function updatedisplay() {
                document.getElementById("handAI1").textContent = handAI1;
                document.getElementById("handAI2").textContent = handAI2;
                document.getElementById("result").textContent = result;
                document.getElementById("wins").textContent = wins;
                document.getElementById("losses").textContent = losses;
                document.getElementById("ties").textContent = ties;
            }

            function updateAI1() {
                hand = Math.floor(Math.random() * 3) + 1;
                if (hand === 1) {
                    handAI1 = "Rock";
                } else if (hand === 2) {
                    handAI1 = "Paper";
                } else {
                    handAI1 = "Scissors";
                }
            }

            function updateAI2() {
                hand = Math.floor(Math.random() * 3) + 1;
                if (hand === 1) {
                    handAI2 = "Rock";
                } else if (hand === 2) {
                    handAI2 = "Paper";
                } else {
                    handAI2 = "Scissors";
                }
            }

            function updateResult() {
                if (handAI1 === handAI2) {
                    result = "It's a tie!";
                    ties = parseInt(ties) + 1;
                } else if (
                    (handAI1 === "Rock" && handAI2 === "Scissors") ||
                    (handAI1 === "Paper" && handAI2 === "Rock") ||
                    (handAI1 === "Scissors" && handAI2 === "Paper")
                ) {
                    result = "AI 1 wins!";
                    wins = parseInt(wins) + 1;
                } else {
                    result = "AI 2 wins!";
                    losses = parseInt(losses) + 1;
                }
                updatedisplay();
            }

            function playAI() {
                updateAI1();
                updateAI2();
                updateResult();
                updatedisplay();
            }

        </script>
    </body>
</html>
